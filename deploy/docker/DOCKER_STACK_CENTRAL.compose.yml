name: vbio-central

services:
  redis:
    image: redis:7
    container_name: vbio-central-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/DOCKER_BACKEND_RUNTIME.Dockerfile
    container_name: vbio-central-api
    restart: unless-stopped
    working_dir: ${BOLTZ_HOST_ROOT}
    env_file:
      - ./DOCKER_STACK_CENTRAL.env
    volumes:
      - ${BOLTZ_HOST_ROOT}:${BOLTZ_HOST_ROOT}
      - ${RESULTS_BASE_DIR:-/data/boltz_central_results}:${RESULTS_BASE_DIR:-/data/boltz_central_results}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >-
      bash -lc "cd ${BOLTZ_HOST_ROOT} && python -m backend.scripts.runtime_entrypoint api"
    ports:
      - "${API_HOST_PORT:-5000}:5000"
    depends_on:
      redis:
        condition: service_healthy

  monitor:
    build:
      context: ../..
      dockerfile: deploy/docker/DOCKER_BACKEND_RUNTIME.Dockerfile
    container_name: vbio-central-monitor
    restart: unless-stopped
    working_dir: ${BOLTZ_HOST_ROOT}
    env_file:
      - ./DOCKER_STACK_CENTRAL.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${BOLTZ_HOST_ROOT}:${BOLTZ_HOST_ROOT}
      - ${RESULTS_BASE_DIR:-/data/boltz_central_results}:${RESULTS_BASE_DIR:-/data/boltz_central_results}
      - ${LEAD_OPTIMIZATION_OUTPUT_DIR:-/data/boltz_lead_optimization_results}:${LEAD_OPTIMIZATION_OUTPUT_DIR:-/data/boltz_lead_optimization_results}
      - ${BOLTZ_MSA_CACHE_DIR:-/data/boltz_msa_cache}:${BOLTZ_MSA_CACHE_DIR:-/data/boltz_msa_cache}
    command: >-
      bash -lc "cd ${BOLTZ_HOST_ROOT} && python -m backend.scripts.runtime_entrypoint monitor"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
