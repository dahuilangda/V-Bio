# V-Bio 标准部署配置模板。
#
# 用法：复制为 configs/vbio.toml（不入 git），按环境改值。
#   cp configs/vbio.example.toml configs/vbio.toml
# 加载：backend/run.sh 与 frontend/run.sh 启动时自动把本文件导出为环境
#   变量（env_file 注入容器 / 进程环境）；真实环境变量优先于本文件。
# 键名即环境变量名，小节仅作组织。全部键由契约测试守护
# （backend/tests/test_vbio_config_contract.py）：代码新读一个配置键
# 而模板缺失时会测试失败，防止配置面发散。
# 运行期注入键（VBIO_TASK_ID、CUDA_VISIBLE_DEVICES 等）不在此列，见测试的排除清单。

# ---------------------------------------------------------------- 核心
[core]
# 统一访问令牌：API 网关、worker、前端三方一致（必改）
VBIO_API_TOKEN = "change-me"
# 代码目录（宿主机绝对路径，容器挂载用；必改）
VBIO_HOST_ROOT = "/data/V-Bio"
# Redis 地址（Celery broker / GPU 池 / 事件流）
REDIS_URL = "redis://localhost:6379/0"
# 中央 API 地址（worker 回传结果/状态）
CENTRAL_API_URL = "http://localhost:5000"
# 前端基址（邮件深链、RFD4 策略网关地址推导）
FRONTEND_URL = ""
# 结果存储根目录
RESULTS_BASE_DIR = "/data/boltz_central_results"
# 任务结果保留天数（zip、中间结果树、lead_opt 输出统一 GC）
RESULTS_RETENTION_DAYS = 90
# 结果定期清理开关与间隔秒（monitor 启动先跑一轮）
RESULTS_CLEANUP_ENABLED = true
RESULTS_CLEANUP_INTERVAL_SECONDS = 21600
# 任务列表 Excel 导出目录与条目 TTL
EXPORTS_BASE_DIR = ""
EXPORT_JOB_TTL_SECONDS = 172800
EXPORT_FILE_TTL_SECONDS = 172800
EXPORT_MAX_TASK_ROWS = 50000
EXPORT_REQUEST_MAX_BYTES = 67108864
# lead optimization 输出目录
LEAD_OPTIMIZATION_OUTPUT_DIR = "/data/boltz_lead_optimization_results"
# MSA(a3m) 序列缓存目录与保留天数（缓存可重建）
VBIO_MSA_CACHE_DIR = "/data/boltz_msa_cache"
MSA_CACHE_RETENTION_DAYS = 90
# worker 共享临时根目录
WORKER_SHARED_TMP_ROOT = ""
# 请求体上限：结构上传 64MiB；worker 归档回传 32GiB
MAX_UPLOAD_BYTES = 67108864
WORKER_RESULT_UPLOAD_MAX_BYTES = 34359738368
# 向客户端回显内部异常详情（生产保持 false）
EXPOSE_ERROR_DETAILS = false
# 允许的跨域来源（逗号分隔；空 = 同源）
VBIO_CORS_ALLOW_ORIGINS = ""
# Flask 调试模式（生产保持 false）
FLASK_DEBUG = false

# ---------------------------------------------------------------- API 服务
[api]
# 运行时 API 监听地址（容器内必须 0.0.0.0，宿主端口映射依赖）
VBIO_RUNTIME_BIND = "0.0.0.0"
# gunicorn 进程数
GUNICORN_WORKERS = 1
# GPU 并发上限（<=0 用全部 GPU）；CPU worker 并发（0 = 全部核心）
MAX_CONCURRENT_TASKS = -1
CPU_MAX_CONCURRENT_TASKS = 0
# 每 API 租户每日 /predict 配额（<=0 关闭）
TENANT_MAX_DAILY = 50
# 任务邮件合并窗口秒（0 = 逐任务即发）
NOTIFY_DIGEST_WINDOW_SECONDS = 900

# ---------------------------------------------------------------- 任务超时
[timeouts]
# 常规单次预测秒数
PREDICTION_SUBPROCESS_TIMEOUT_SECONDS = 10800
# boltz2score 评分软/硬超时（硬须大于软 +300s）
BOLTZ2SCORE_TASK_SOFT_TIME_LIMIT_SECONDS = 16200
BOLTZ2SCORE_TASK_HARD_TIME_LIMIT_SECONDS = 18000
# 多肽候选/父任务超时（<=0 禁用）；预算估算参数
PEPTIDE_CANDIDATE_SUBPROCESS_TIMEOUT_SECONDS = 0
PEPTIDE_PARENT_SUBPROCESS_TIMEOUT_SECONDS = 0
PEPTIDE_PARENT_TIMEOUT_PER_WAVE_SECONDS = 1800
PEPTIDE_PARENT_TIMEOUT_BUFFER_SECONDS = 1800
# 多肽候选等 GPU 上限（<=0 一直等待）
PEPTIDE_GPU_ACQUIRE_TIMEOUT_SECONDS = 0
# 候选派发窗口与 refine 队列宽限秒
PEPTIDE_CANDIDATE_DISPATCH_WINDOW = ""
PEPTIDE_REFINE_QUEUE_GRACE_SECONDS = ""
# D 肽相关
DPEPTIDE_PLDDT_GATE = ""
DPEPTIDE_TARGET_PREDICT_TIMEOUT_SECONDS = ""

# ---------------------------------------------------------------- MSA 服务
[msa]
# ColabFold MSA 服务地址（生产必改）
MSA_SERVER_URL = "http://localhost:8080"
MSA_SERVER_TIMEOUT_SECONDS = 1800
# ColabFold 任务目录（历史清理用）
COLABFOLD_JOBS_DIR = "/data/colabfold/jobs"
# mmseqs 并发与私服凭据（可空）
VBIO_MSA_SEARCH_CONCURRENCY = 4
VBIO_MSA_USERNAME = ""
VBIO_MSA_PASSWORD = ""
MSA_API_KEY_VALUE = ""
# MSA 软保留：存活的 MSA 等待方让长任务让出下一张空卡
GPU_MSA_RESERVE_ENABLED = true
GPU_MSA_RESERVE_HOLDER_LIMIT = 3
GPU_MSA_WAITER_STALE_SECONDS = 180
VBIO_MSA_HEALTH_SWEEP_SECONDS = ""

# ---------------------------------------------------------------- GPU 池
[gpu]
# 可用 GPU ID 列表（如 "0,1,3"；空 = 自动探测）
GPU_DEVICE_IDS = ""
# 池键命名空间（多套部署共用一个 Redis 时区分）
GPU_POOL_NAMESPACE = ""
# 池维护周期秒；孤儿容器策略 report/kill 与最短运行秒
GPU_MAINTENANCE_INTERVAL_SECONDS = 300
GPU_ORPHAN_POLICY = "report"
GPU_ORPHAN_MIN_AGE_SECONDS = 1800
GPU_WAITER_STALE_SECONDS = 180
# 高优等待让位开关
GPU_PRIORITY_RESERVE_ENABLED = true
# ESM3 提案器 GPU 与服务
ESM3_GPU_ID = "0"
ESM3_SERVER_URL = "http://localhost:9333"
ESM3_TIMEOUT_SECONDS = 600
# 二级结构条件（DSSP 单字母平铺；空串关闭）
ESM3_SS_PROFILE = "H"
ESM3_PEPTIDE_FIRST = false
# 结果盘水位告警（仅告警不阻断）
DISK_WARN_PERCENT = 85
DISK_CRITICAL_PERCENT = 92

# ---------------------------------------------------------------- 引擎
[boltz2]
BOLTZ2_DOCKER_IMAGE = "vbio-boltz2-runtime"
BOLTZ2_DOCKER_EXTRA_ARGS = ""
BOLTZ2_DOCKER_SHM_SIZE = "16g"
BOLTZ2_HOST_CACHE_DIR = ""
BOLTZ2_CONTAINER_CACHE_DIR = "/root/.boltz"

[alphafold3]
ALPHAFOLD3_DOCKER_IMAGE = "jurgjn/alphafold3:v3.0.2"
ALPHAFOLD3_MODEL_DIR = ""
ALPHAFOLD3_DATABASE_DIR = ""
ALPHAFOLD3_DOCKER_EXTRA_ARGS = ""
ALPHAFOLD3_JAX_CACHE_DIR = ""
ALPHAFOLD3_VALIDATE_MAX_LINES = ""
# AF3 CCD 单字母映射覆盖（JSON）
VBIO_AF3_CCD_ONE_LETTER_OVERRIDES = ""

[protenix]
PROTENIX_DOCKER_IMAGE = "vbio-protenix-v2-runtime:2.0.0"
PROTENIX_MODEL_DIR = ""
PROTENIX_MODEL_NAME = "protenix-v2"
PROTENIX_SOURCE_DIR = ""
PROTENIX_DOCKER_EXTRA_ARGS = "--entrypoint="
PROTENIX_INFER_EXTRA_ARGS = ""
PROTENIX_PYTHON_BIN = "/usr/local/micromamba/envs/protenix/bin/python"
PROTENIX_USE_HOST_USER = "false"
PROTENIX_CONTAINER_APP_DIR = "/app"
PROTENIX_CONTAINER_MODEL_DIR = "/workspace/model"
PROTENIX_CONTAINER_CHECKPOINT_PATH = ""
PROTENIX_COMMON_CACHE_DIR = "/data/protenix/common_cache"
PROTENIX_MODULE_CACHE_DIR = "/data/protenix/module_cache"
PROTENIX_DISABLE_TFG = ""
PROTENIX2DOCK_REFINE_SAMPLING_STEPS = ""
# protenix2dock 亲和头权重（空 = 关闭）
PROTENIX2DOCK_AFFINITY_CKPT = ""
# protenix 嵌套容器镜像 tag
P2D_IMAGE = "vbio-protenix-v2-runtime:2.0.0"

[mol1]
MOL1_DOCKER_IMAGE = "vbio-mol1-runtime:1.0.3"
MOL1_DATA_DIR = "/data/mol1"
MOL1_ATOM_CONFIDENCE = ""

[rfd4]
RFD4_DOCKER_IMAGE = "rfd4-proteina-engine:cu13"
RFD4_DATA_DIR = "/data/rfd4-proteina"
# 每次生成候选数
RFD4_NUM_DESIGNS = 2
# 覆盖默认 binder contig（默认 "12-22, /0, A1-<靶标长度>"）
RFD4_CONTIG = ""

[nesso]
NESSO_DOCKER_IMAGE = "vbio-nesso-runtime:1.0.0"
NESSO_DOCKER_EXTRA_ARGS = ""
NESSO_HOST_CACHE_DIR = "/data/nesso_cache"
NESSO_CONTAINER_CACHE_DIR = "/workspace/nesso-cache"
NESSO_MODEL_REVISION = "v1.0.0"
NESSO_NO_KERNELS = "true"
NESSO_RECYCLING_STEPS = 5
NESSO_NUM_WORKERS = 2
NESSO_PRECISION = "bf16-mixed"

# ---------------------------------------------------------------- Worker
[worker]
# GPU worker 承接的引擎能力（逗号分隔）
GPU_WORKER_CAPABILITIES = "boltz2,alphafold3,protenix,nesso,mol1,rfd4"
# CPU worker 承接的服务（export 承接任务列表异步导出）
CPU_WORKER_CAPABILITIES = "lead_opt,peptide_design,export"
# 兼容旧栈的统一能力变量（GPU/CPU 均缺省时回退读它）
WORKER_CAPABILITIES = ""
# MSA 池 Redis 键覆盖（默认与 GPU 池键一致，多套部署隔离用）
VBIO_MSA_GPU_POOL_KEY = ""
VBIO_MSA_GPU_IN_USE_KEY = ""

