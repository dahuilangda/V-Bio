# Phosphopeptide motif conditioning: PTR (phosphotyrosine NCAA)
# identity and phosphate coordinates pinned; the expandable 6-9 segment
# is designed by the model. Verified output keeps PTR@7.
peptide_motif:
  input: examples/inputs/egfr2_phosphopeptide.cif
  contig: "/0, B1-13, 6-9"
  conditions:
    C_SEQ: {true: [{select: "sel('B/PTR/7')"}]}
    C_CRD: {true: [{select: "sel('B/PTR/7/[P,O1P,O2P,O3P]')"}]}
