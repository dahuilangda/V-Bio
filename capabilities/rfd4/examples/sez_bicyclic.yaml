# SEZ 双环 motif 条件化：SEZ 三臂（CD/C1/C2）与三 Cys 锚点固定，
# 两环序列由模型设计。实测输出 SEZ 三硫醚闭合（1.98/2.25/2.18 Å）。
bicyclic_motif:
  input: examples/inputs/sez_bicyclic.cif
  contig: "B1-15, /0, C1"
  conditions:
    C_SEQ: {true: [{select: "sel('B/CYS')"}, {select: "sel('C')"}]}
    C_CRD: {true: [{select: "sel('C')"}, {select: "sel('B/CYS/*/[SG]')"}]}
