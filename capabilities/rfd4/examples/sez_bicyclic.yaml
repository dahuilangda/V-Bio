# SEZ bicyclic motif conditioning: SEZ arms (CD/C1/C2) and the
# three Cys anchors pinned; both ring sequences designed by the model.
# Verified output closes the trithioether (1.98/2.25/2.18 Å).
bicyclic_motif:
  input: examples/inputs/sez_bicyclic.cif
  contig: "B1-15, /0, C1"
  conditions:
    C_SEQ: {true: [{select: "sel('B/CYS')"}, {select: "sel('C')"}]}
    C_CRD: {true: [{select: "sel('C')"}, {select: "sel('B/CYS/*/[SG]')"}]}
